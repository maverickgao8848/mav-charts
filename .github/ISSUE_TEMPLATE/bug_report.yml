name: Bug report
description: Report a reproducible chart, accessibility, package, or documentation defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: chart
    attributes:
      label: Chart ID or package
      placeholder: C01 or @mav-charts/themes
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include data, props, environment, and a minimal repository or code sample.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
